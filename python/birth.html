<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Chellamma</title>

<style>
body{
 margin:0;
 font-family:'Segoe UI',sans-serif;
 height:100vh;
 overflow:hidden;
 display:flex;
 align-items:center;
 justify-content:center;
 background:linear-gradient(270deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
 background-size:800% 800%;
 animation:bgmove 12s ease infinite;
}

@keyframes bgmove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.card{
 background:white;
 padding:40px;
 border-radius:25px;
 text-align:center;
 box-shadow:0 20px 50px rgba(0,0,0,0.25);
 max-width:420px;
 z-index:5;
}

.name{
 font-size:38px;
 font-weight:bold;
 color:#ff4d6d;
 animation:glow 2s infinite alternate;
}

@keyframes glow{
from{ text-shadow:0 0 5px #ff4d6d,0 0 10px #ff4d6d }
 to{ text-shadow:0 0 20px #ff85a1,0 0 35px #ff85a1 }
}

p{font-size:18px;color:#444}

button{
 margin-top:20px;
 padding:12px 25px;
 border:none;
 border-radius:25px;
 background:#ff4d6d;
 color:white;
 font-size:16px;
 cursor:pointer;
 transition:0.3s;
}

button:hover{transform:scale(1.1)}

#message{
 margin-top:20px;
 font-weight:bold;
 color:#6a0572;
}

/* cake */
.cake{
 font-size:70px;
 animation:bounce 2s infinite;
}

@keyframes bounce{
0%{transform:translateY(0)}
50%{transform:translateY(-12px)}
100%{transform:translateY(0)}
}

/* candle flame */
.flame{
 font-size:20px;
 animation:flicker 0.3s infinite alternate;
}

@keyframes flicker{
from{opacity:1}
 to{opacity:0.5}
}

/* balloons */
.balloon{
 position:absolute;
 bottom:-150px;
 font-size:42px;
 animation:floatUp linear infinite;
}

@keyframes floatUp{
0%{transform:translateY(0)}
100%{transform:translateY(-120vh)}
}

/* hearts */
.heart{
 position:absolute;
 font-size:22px;
 animation:heartFloat 6s linear infinite;
}

@keyframes heartFloat{
0%{transform:translateY(0) scale(1);opacity:1}
100%{transform:translateY(-100vh) scale(1.6);opacity:0}
}

/* confetti */
.confetti{
 position:absolute;
 width:8px;
 height:8px;
 animation:confettiFall 3s linear forwards;
}

@keyframes confettiFall{
0%{transform:translateY(-20px)}
100%{transform:translateY(100vh)}
}

/* fireworks */
.firework{
 position:absolute;
 font-size:28px;
 animation:firework 1s ease-out forwards;
}

@keyframes firework{
0%{transform:scale(0);opacity:1}
100%{transform:scale(3);opacity:0}
}

.photo{
 width:120px;
 height:120px;
 border-radius:50%;
 object-fit:cover;
 margin-bottom:10px;
 border:4px solid #ff4d6d;
}

</style>
</head>

<body>

<div class="card">

<!-- optional photo -->
<img class="photo" src="https://i.imgur.com/6VBx3io.png" alt="Geetha Rani">

<div class="cake">🎂<span class="flame">🔥</span></div>

<div class="name">Happy Birthday Geetha Rani 💖</div>

<p>You are not just my sister,you are everything to me.</p>

<button onclick="celebrate()">Click for Surprise 🎁</button>

<p id="message"></p>

</div>

<!-- balloons -->
<div class="balloon" style="left:10%; animation-duration:8s;">🎈</div>
<div class="balloon" style="left:25%; animation-duration:10s;">🎈</div>
<div class="balloon" style="left:40%; animation-duration:7s;">🎈</div>
<div class="balloon" style="left:60%; animation-duration:9s;">🎈</div>
<div class="balloon" style="left:75%; animation-duration:11s;">🎈</div>
<div class="balloon" style="left:90%; animation-duration:8s;">🎈</div>

<audio id="music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

<script>

function celebrate(){

 document.getElementById("message").innerHTML="✨ May your life be full of happiness, success and endless smiles. Love you Geetha Rani 💕";

 document.getElementById("music").play();

 // confetti
 for(let i=0;i<90;i++){
  let c=document.createElement("div");
  c.className="confetti";
  c.style.left=Math.random()*100+"%";
  c.style.background=`hsl(${Math.random()*360},100%,50%)`;
  document.body.appendChild(c);
 }

 // hearts
 for(let i=0;i<25;i++){
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💖";
  h.style.left=Math.random()*100+"%";
  h.style.bottom="0";
  document.body.appendChild(h);
 }

 // fireworks
 for(let i=0;i<12;i++){
  let f=document.createElement("div");
  f.className="firework";
  f.innerHTML="🎆";
  f.style.left=Math.random()*100+"%";
  f.style.top=Math.random()*80+"%";
  document.body.appendChild(f);
 }

}

</script>

</body>
</html>
